name: Figures de Wikimedia Commons
# Chaque lundi, et à la demande : les fichiers empruntés existent-ils toujours, sous une licence libre ?
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  commons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_commons.py
