<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<base href="../">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calage des couronnes des bêtes — outil</title>
<style>
  body { margin: 0; font: 14px Georgia, serif; background: #f4ecd8; color: #2a2418; }
  header { position: sticky; top: 0; z-index: 5; background: #e8dcc0; padding: 8px 14px; border-bottom: 1px solid #b9a678; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header b { font-size: 15px; }
  button { font: inherit; padding: 4px 10px; cursor: pointer; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; padding: 12px; }
  .tile { background: #fbf6e8; border: 1px solid #cdbf98; padding: 6px; }
  .tile.modif { border-color: #b3441c; box-shadow: 0 0 0 2px #e8b49c; }
  .tile h3 { margin: 0 0 4px; font-size: 13px; display: flex; justify-content: space-between; gap: 6px; }
  .tile h3 span { font: 11px monospace; color: #6b5d3a; }
  .tile svg { width: 100%; height: auto; display: block; cursor: crosshair; touch-action: none; }
  .tile .bar { display: flex; gap: 4px; margin-top: 4px; }
  .tile .bar button { padding: 1px 7px; }
  textarea { width: 100%; height: 110px; font: 12px monospace; }
  p.aide { margin: 0; font-size: 12px; color: #4b3f22; }
</style>
</head>
<body>
<header>
  <b>Couronnes des bêtes</b>
  <label>Filtre <input id="filtre" placeholder="lion, cerf…" size="14"></label>
  <label>Émail <select id="email"><option>Or</option><option>Argent</option><option>Gueules</option><option>Azur</option><option>Sable</option></select></label>
  <button id="copier">Copier les ancrages modifiés</button>
  <button id="tout">Copier tous les ancrages</button>
  <span id="etat"></span>
  <p class="aide">Cliquez ou glissez sur une bête pour placer le <i>centre</i> de la couronne ; molette ou − / + pour sa largeur ; ↺ remet la valeur d'origine.</p>
</header>
<div id="grid"></div>
<textarea id="sortie" placeholder="Les ancrages copiés apparaissent ici (kind: [x, y, largeur])." readonly></textarea>
<svg id="measure" width="0" height="0" style="position:absolute;visibility:hidden" aria-hidden="true"><g></g></svg>
<script src="assets/blason.js"></script>
<script src="assets/blasonnement.js"></script>
<script src="assets/lecture.js"></script>
<script src="assets/dessin.js"></script>
<script>
/* Outil de travail : place la couronne de chaque bête (m.couronne = [x, y, largeur], dans le cadre de la figure) et sort les valeurs à coller dans data/atelier.json. */
const ORIG = {}, TILES = new Map();
const OFFY = 2;                       // la figure seule est posée au centre, à (100, 118) : son cadre est décalé de 2 en y
let EM = "Or";
function etatDe(kind) {
  const St = fresh();
  St.A[0] = { ...ADEFS[0], m: kind, nb: "1", t1: "Azur", tm: EM === "Argent" ? "Or" : "Argent", cn: EM };
  normalizeAll(St); return St;
}
async function dessine(t) {
  const St = etatDe(t.kind); await loadAll(St);
  const r = compose(St, "t" + t.i);
  t.vb = Array.isArray(r.vb) ? r.vb.map(Number) : String(r.vb).split(/[\s,]+/).map(Number);
  t.svg.setAttribute("viewBox", t.vb.join(" ")); t.svg.innerHTML = r.svg;
  const c = meuble(t.kind).couronne;
  t.val.textContent = `[${c.map(v => +(+v).toFixed(1)).join(", ")}]`;
  t.el.classList.toggle("modif", JSON.stringify(c) !== JSON.stringify(ORIG[t.kind]));
}
const aCoords = (t, e) => { const b = t.svg.getBoundingClientRect(), [vx, vy, vw, vh] = t.vb; return [vx + (e.clientX - b.left) / b.width * vw, vy + (e.clientY - b.top) / b.height * vh]; };
function regle(t, f) {
  const m = meuble(t.kind), c = m.couronne.slice(); f(c);
  c[0] = +Math.max(0, Math.min(200, c[0])).toFixed(1); c[1] = +Math.max(0, Math.min(252, c[1])).toFixed(1); c[2] = +Math.max(6, Math.min(60, c[2])).toFixed(1);
  m.couronne = c; return dessine(t);
}
function maj() { document.getElementById("etat").textContent = `${[...TILES.values()].filter(t => t.el.classList.contains("modif")).length} modifiée(s)`; }
(async () => {
  const [r1, r2] = await Promise.all([fetch("data/data.json"), fetch("data/atelier.json")]);
  DATA = await r1.json(); ATL = await r2.json();
  document.body.insertAdjacentHTML("afterbegin", globalDefs());      // les dégradés et hachures des émaux
  const grid = document.getElementById("grid");
  ATL.meubles.filter(m => m.couronne).forEach((m, i) => {
    ORIG[m.kind] = m.couronne.slice();
    const el = document.createElement("div"); el.className = "tile";
    el.innerHTML = `<h3>${m.nom}<span></span></h3><svg xmlns="http://www.w3.org/2000/svg"></svg><div class="bar"><button data-a="-">−</button><button data-a="+">+</button><button data-a="r">↺</button></div>`;
    const t = { kind: m.kind, i, el, svg: el.querySelector("svg"), val: el.querySelector("h3 span"), vb: [0, 0, 200, 252] };
    TILES.set(m.kind, t); grid.appendChild(el);
    let drag = false;
    const pose = e => { const [x, y] = aCoords(t, e); regle(t, c => { c[0] = x; c[1] = y - OFFY; }).then(maj); };
    t.svg.addEventListener("pointerdown", e => { drag = true; t.svg.setPointerCapture(e.pointerId); pose(e); });
    t.svg.addEventListener("pointermove", e => { if (drag) pose(e); });
    t.svg.addEventListener("pointerup", () => { drag = false; });
    t.svg.addEventListener("wheel", e => { e.preventDefault(); regle(t, c => { c[2] += e.deltaY < 0 ? 1 : -1; }).then(maj); }, { passive: false });
    el.querySelector(".bar").addEventListener("click", e => {
      const a = e.target.dataset.a; if (!a) return;
      regle(t, c => { if (a === "r") { c[0] = ORIG[t.kind][0]; c[1] = ORIG[t.kind][1]; c[2] = ORIG[t.kind][2]; } else c[2] += a === "+" ? 1 : -1; }).then(maj);
    });
  });
  for (const t of TILES.values()) await dessine(t);
  maj();
  document.getElementById("filtre").addEventListener("input", e => { const q = e.target.value.trim().toLowerCase(); for (const t of TILES.values()) t.el.hidden = !!q && !(t.kind.includes(q) || meuble(t.kind).nom.toLowerCase().includes(q)); });
  document.getElementById("email").addEventListener("change", async e => { EM = e.target.value; for (const t of TILES.values()) await dessine(t); });
  const sortie = (seulementModifies) => {
    const o = [...TILES.values()].filter(t => !seulementModifies || t.el.classList.contains("modif")).map(t => `"${t.kind}": ${JSON.stringify(meuble(t.kind).couronne)}`);
    const s = "{\n  " + o.join(",\n  ") + "\n}";
    document.getElementById("sortie").value = s;
    navigator.clipboard && navigator.clipboard.writeText(s).catch(() => {});
  };
  document.getElementById("copier").onclick = () => sortie(true);
  document.getElementById("tout").onclick = () => sortie(false);
})();
</script>
</body>
</html>
